name: quill-dmg-diagnostic

# One-off diagnostic (2026-11-13): the tap proof's online audit reports
# "No binaries in App" for cyan-eclipse-quill. Mount the pinned arm64
# DMG on a stock runner and print the app bundle's actual structure.
# Manual dispatch only. Remove after use.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Download and inspect the Quill arm64 DMG
        run: |
          set -uxo pipefail
          cd "$RUNNER_TEMP"
          curl -sL -o quill.dmg "https://pub-f66188d686c844b4a8499ca3b2a544cd.r2.dev/downloads/quill/0.1.0/cyan-eclipse-quill-v0.1.0-mac-arm64.dmg"
          shasum -a 256 quill.dmg
          hdiutil attach quill.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mnt"
          echo "=== DMG root ==="
          ls -la "$RUNNER_TEMP/mnt"
          echo "=== app tree (2 levels) ==="
          find "$RUNNER_TEMP/mnt/Cyan Eclipse Quill.app" -maxdepth 3 -print
          echo "=== Contents/MacOS ==="
          ls -la "$RUNNER_TEMP/mnt/Cyan Eclipse Quill.app/Contents/MacOS" || echo "NO MacOS DIR"
          echo "=== file types in MacOS ==="
          file "$RUNNER_TEMP/mnt/Cyan Eclipse Quill.app/Contents/MacOS/"* || true
          echo "=== CFBundleExecutable ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$RUNNER_TEMP/mnt/Cyan Eclipse Quill.app/Contents/Info.plist" || echo "NO CFBundleExecutable KEY"
          hdiutil detach "$RUNNER_TEMP/mnt"
